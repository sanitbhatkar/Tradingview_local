<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Chart Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Lightweight Charts (pinned to v4 standalone build) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Multi-Chart Dashboard</h1>
    <div class="controls">
      <label class="count-label">NUMBER OF CHARTS</label>
      <select id="chartCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="6">6</option>
        <option value="8">8</option>
      </select>
      <span class="status" id="hlStatus"><i class="dot"></i>HL live</span>
      <span class="status" id="usStatus"><i class="dot"></i>US market</span>
      <span class="status" id="inStatus"><i class="dot"></i>IN market</span>
    </div>
  </header>

  <main id="grid" class="grid grid-4"><!-- panes injected by app.js --></main>

  <!-- A single pane is cloned from this template for every chart. -->
  <template id="paneTemplate">
    <section class="pane">
      <div class="pane-head">
        <select class="sel-source"></select>
        <select class="sel-symbol"></select>
        <select class="sel-timeframe"></select>
        <button class="indicators" type="button">INDICATORS</button>
        <div class="ticker">
          <span class="ticker-sym">--</span>
          <span class="ticker-price">--</span>
          <span class="ticker-chg">--</span>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="indicator-panel" hidden></div>
        <div class="chart"></div>
      </div>
    </section>
  </template>

  <!-- Indicator modules are auto-discovered (/api/indicators) and loaded
       on demand by app.js via dynamic import(); no static tags needed. -->
  <script src="/static/app.js"></script>
</body>
</html>
